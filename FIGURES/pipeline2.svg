<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:24px;font-weight:700}.m{font-size:18px;font-weight:600}.s{font-size:16px}.xs{font-size:14px}.box{stroke:#333;stroke-width:2;rx:18;ry:18}.thin{stroke:#555;stroke-width:2;fill:none}.dash{stroke:#555;stroke-width:2;stroke-dasharray:10 8;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="white"/>

  <!-- External evaluation -->
  <rect x="110" y="55" width="285" height="145" fill="#eef3fb" class="box"/>
  <text x="252" y="90" text-anchor="middle" class="t m">External Validation Set</text>
  <text x="252" y="118" text-anchor="middle" class="t s">CRC-VAL-HE-7K</text>
  <rect x="145" y="132" width="55" height="38" fill="#d7bfdc" stroke="#555"/>
  <rect x="210" y="132" width="55" height="38" fill="#e7d3d9" stroke="#555"/>
  <rect x="275" y="132" width="55" height="38" fill="#c8a7c9" stroke="#555"/>
  <text x="252" y="190" text-anchor="middle" class="t xs">Never used in training</text>

  <!-- Source and target -->
  <text x="635" y="42" text-anchor="middle" class="t m">Source Domain</text>
  <text x="635" y="66" text-anchor="middle" class="t xs">NCT-CRC-HE-100K</text>
  <rect x="505" y="78" width="260" height="142" fill="#f8f3ef" class="box"/>
  <rect x="545" y="100" width="55" height="38" fill="#d7bfdc" stroke="#555"/>
  <rect x="610" y="100" width="55" height="38" fill="#e7d3d9" stroke="#555"/>
  <rect x="675" y="100" width="55" height="38" fill="#c8a7c9" stroke="#555"/>
  <text x="635" y="165" text-anchor="middle" class="t xs">ADI, TUM, etc.</text>
  <text x="635" y="194" text-anchor="middle" class="t s">Labeled Source Data</text>

  <text x="995" y="42" text-anchor="middle" class="t m">Target Domain</text>
  <text x="995" y="66" text-anchor="middle" class="t xs">TCGA COAD and READ</text>
  <rect x="865" y="78" width="260" height="142" fill="#f8f3ef" class="box"/>
  <rect x="905" y="100" width="55" height="38" fill="#d7bfdc" stroke="#555"/>
  <rect x="970" y="100" width="55" height="38" fill="#e7d3d9" stroke="#555"/>
  <rect x="1035" y="100" width="55" height="38" fill="#c8a7c9" stroke="#555"/>
  <text x="995" y="194" text-anchor="middle" class="t s">Unlabeled Target Data</text>

  <!-- Stage 1 -->
  <rect x="520" y="255" width="590" height="145" fill="#f2f2f2" class="box"/>
  <text x="555" y="288" class="t m">Stage 1  Offline Frozen Feature Extraction</text>
  <text x="815" y="328" text-anchor="middle" class="t h">Frozen UNI2-H</text>
  <text x="815" y="354" text-anchor="middle" class="t s">Feature Extractor</text>
  <rect x="665" y="368" width="125" height="22" fill="#fff" stroke="#555"/>
  <rect x="840" y="368" width="125" height="22" fill="#fff" stroke="#555"/>
  <text x="728" y="384" text-anchor="middle" class="t xs">Source Features</text>
  <text x="903" y="384" text-anchor="middle" class="t xs">Target Features</text>

  <!-- Stage 2 -->
  <rect x="435" y="445" width="760" height="190" fill="#dddddd" class="box"/>
  <text x="470" y="478" class="t m">Stage 2  Feature-level UDA Training</text>
  <rect x="735" y="492" width="160" height="55" fill="#d9c1c8" class="box"/>
  <text x="815" y="515" text-anchor="middle" class="t xs">Trainable Bottleneck</text>
  <text x="815" y="536" text-anchor="middle" class="t xs">Adapter</text>
  <rect x="645" y="564" width="340" height="48" fill="#fff" class="box"/>
  <text x="815" y="594" text-anchor="middle" class="t m">Adapted Source and Target Features</text>
  <rect x="520" y="620" width="240" height="58" fill="#fff" class="box"/>
  <text x="640" y="654" text-anchor="middle" class="t m">Trainable Classifier Head</text>
  <rect x="870" y="620" width="250" height="58" fill="#fff" class="box"/>
  <text x="995" y="644" text-anchor="middle" class="t s">Trainable Domain</text>
  <text x="995" y="665" text-anchor="middle" class="t s">Discriminator GRL</text>

  <!-- Stage 3 -->
  <rect x="455" y="710" width="720" height="145" fill="#dfeaf5" class="box"/>
  <text x="488" y="741" class="t m">Stage 3  Adaptation Objectives</text>
  <g class="t xs" text-anchor="middle">
    <rect x="500" y="762" width="115" height="58" fill="white" stroke="#777"/><text x="558" y="784">Classification</text><text x="558" y="805">Loss  LCE</text>
    <rect x="628" y="762" width="105" height="58" fill="white" stroke="#777"/><text x="681" y="784">CORAL</text><text x="681" y="805">LCORAL</text>
    <rect x="746" y="762" width="110" height="58" fill="white" stroke="#777"/><text x="801" y="784">MK-MMD</text><text x="801" y="805">LMK-MMD</text>
    <rect x="869" y="762" width="135" height="58" fill="white" stroke="#777"/><text x="936" y="780">Prototype-guided</text><text x="936" y="801">Semantic Loss</text><text x="936" y="818">LProto</text>
    <rect x="1017" y="762" width="115" height="58" fill="white" stroke="#777"/><text x="1075" y="784">Adversarial</text><text x="1075" y="805">Loss  LAdv</text>
  </g>
  <text x="815" y="842" text-anchor="middle" class="t xs">Ltotal = LCE + λc LCORAL + λm LMK-MMD + 1[e ≥ 3] λp LProto + λa LAdv</text>

  <!-- Stage 4 -->
  <rect x="1215" y="445" width="330" height="410" fill="#ead9de" class="box"/>
  <text x="1246" y="478" class="t m">Stage 4  Evaluation</text>
  <rect x="1250" y="505" width="260" height="135" fill="#f8e8c5" class="box"/>
  <text x="1380" y="535" text-anchor="middle" class="t m">External Evaluation</text>
  <text x="1380" y="560" text-anchor="middle" class="t s">CRC-VAL-HE-7K</text>
  <text x="1280" y="590" class="t xs">• Macro-F1</text>
  <text x="1280" y="612" class="t xs">• Balanced Accuracy</text>
  <text x="1395" y="590" class="t xs">• Accuracy</text>
  <text x="1395" y="612" class="t xs">• Class-wise F1</text>

  <rect x="1250" y="665" width="260" height="155" fill="#f7d5d2" class="box"/>
  <text x="1380" y="695" text-anchor="middle" class="t m">Target Domain Alignment</text>
  <text x="1380" y="719" text-anchor="middle" class="t s">Assessment on TCGA</text>
  <text x="1280" y="747" class="t xs">• CORAL</text>
  <text x="1280" y="769" class="t xs">• MK-MMD</text>
  <text x="1280" y="791" class="t xs">• ProtoDist</text>
  <text x="1400" y="747" class="t xs">• PAD</text>
  <text x="1400" y="769" class="t xs">• NC-Entropy</text>
  <text x="1400" y="791" class="t xs">• Majority</text>

  <!-- Arrows -->
  <path d="M635 220 L635 255" class="thin" marker-end="url(#arrow)"/>
  <path d="M995 220 L995 255" class="thin" marker-end="url(#arrow)"/>
  <path d="M815 400 L815 445" class="thin" marker-end="url(#arrow)"/>
  <path d="M815 547 L815 564" class="thin" marker-end="url(#arrow)"/>
  <path d="M815 612 L640 620" class="thin" marker-end="url(#arrow)"/>
  <path d="M815 612 L995 620" class="thin" marker-end="url(#arrow)"/>
  <path d="M815 678 L815 710" class="thin" marker-end="url(#arrow)"/>
  <path d="M1175 782 L1215 782" class="thin" marker-end="url(#arrow)"/>
  <path d="M395 200 L395 575 L1215 575" class="dash" marker-end="url(#arrow)"/>
</svg>